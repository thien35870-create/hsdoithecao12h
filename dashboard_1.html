<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Demo</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header><a class="brand" href="index.html">TheCao<span>Demo</span></a><span class="pill">ADMIN DEMO</span><a class="admin-link" href="index.html">Thoát</a></header>
<main class="container"><div class="dash-title"><div><p class="eyebrow">DASHBOARD</p><h1>Quản trị hệ thống demo</h1></div><button class="small" onclick="resetData()">Đặt lại dữ liệu mẫu</button></div>
<section class="cards"><div class="card stat"><span>Giao dịch mẫu</span><b id="count">12</b></div><div class="card stat"><span>Tỷ lệ quy đổi</span><b>85%</b></div><div class="card stat"><span>Trạng thái</span><b class="ok">Hoạt động</b></div></section>
<section class="card"><div class="section-head"><h2>Lịch sử giao dịch mẫu</h2><input id="search" placeholder="Tìm theo mã demo..." oninput="render()"></div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Giá trị</th><th>Nhận</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card settings"><h2>Cài đặt demo</h2><label>Tỷ lệ quy đổi<input id="rate" type="number" value="85" min="1" max="100"> </label><button class="small" onclick="saveRate()">Lưu tỷ lệ</button><span id="saved" class="ok"></span></section>
<div class="notice">Đây là dashboard mô phỏng. Không có xử lý tiền thật, mã thẻ thật, OTP hay tài khoản ngân hàng.</div>
</main><script src="assets/admin.js"></script></body></html>
